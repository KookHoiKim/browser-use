# Mind2Web Benchmark Configuration
# ==================================
# Tuned for running the Online-Mind2Web benchmark dataset.
# Uses the same multi-agent orchestration (Planner/Searcher/Critic).
#
# Usage:
#   python running_dirs/run_mind2web.py --config configs/mind2web_benchmark.yaml --headless --concurrency 5

agents:
  planner:
    enabled: true
    prompt_path: prompts/planner.md
    provider:
      type: vllm
      model_name: Qwen3VL_32b
      base_url: http://127.0.0.1:3333/v1
      temperature: 0.2
      max_completion_tokens: 4096
    max_tokens_per_call: 4096
    budget_max_calls: 80

  searcher:
    enabled: true
    prompt_path: prompts/searcher.md
    provider:
      type: vllm
      model_name: Qwen3VL_32b
      temperature: 0.1
      max_completion_tokens: 2048
    max_tokens_per_call: 2048
    budget_max_calls: 20

  critic:
    enabled: true
    prompt_path: prompts/critic.md
    provider:
      type: vllm
      model_name: Qwen3VL_32b
      temperature: 0.1
      max_completion_tokens: 2048
    max_tokens_per_call: 2048
    budget_max_calls: 40

orchestrator:
  max_steps: 30               # Mind2Web tasks avg ~7 reference steps; 30 gives headroom
  loop_detection_window: 5
  loop_detection_threshold: 3
  searcher_on_first_step: true
  searcher_mode: adaptive
  always_use_critic: true
  force_replan_on_loop: true
  abort_on_critic_reject_count: 3

logging:
  run_dir_base: runs/mind2web
  experiment_name: mind2web
  save_screenshots: true
  save_dom_snapshots: false    # Disabled to reduce disk usage across 300 tasks
  log_level: INFO
